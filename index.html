
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookArt Studio</title>

    <link rel="stylesheet" href="css/style.css">
</head>



    <h1>📚 BookArt Studio</h1>
    <p>Generator für Buchfalt- und Schneidvorlagen</p>

    <input type="file" id="imageInput" accept="image/*">
    <h3>Textvorlage</h3>

<label>Text</label>
<input type="text" id="textInput" placeholder="lebe">

<label>Schriftart</label>
<select id="fontSelect">
    <option value="script">Handschrift</option>
    <option value="serif">Serif</option>
    <option value="sans">Sans</option>
</select>

<label>Technik</label>
<select id="patternType">
    <option value="fold">Nur Falten</option>
    <option value="cutfold">Schneiden & Falten</option>
</select>
<button id="generateBtn">Vorlage erstellen</button>
<img id="preview" style="max-width:100%; margin-top:20px; display:none;">


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
